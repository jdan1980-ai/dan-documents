  var L = seam.getTotalLength();
  seam.style.strokeDasharray = L;
  seam.style.strokeDashoffset = L;

  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(x){ return x*x*(3 - 2*x); }
  // trapezoid fade: 0 before a, ramp a->b, hold, ramp down c->d, 0 after d
  function seg(t,a,b,c,d){ if(t<=a||t>=d)return 0; if(t<b)return (t-a)/(b-a); if(t<c)return 1; return 1-(t-c)/(d-c); }

  function render(t){
    if(t<0)t=0; if(t>DUR)t=DUR;
    // gold fills bottom -> top between 1s and 7s
    var fill = ease(clamp((t-1)/6));
    seam.style.strokeDashoffset = L*(1-fill);
    // glow settles in after the fill, then breathes gently
    var g = clamp((t-6.2)/1.6);
    var breathe = 0.82 + 0.18*Math.sin(t*1.05);
    var blur = (6 + 16*g*breathe);
    var spread = (2 + 8*g*breathe);
    seam.style.filter = "drop-shadow(0 0 "+blur.toFixed(1)+"px rgba(233,198,110,"+(0.5+0.45*g).toFixed(2)+")) drop-shadow(0 0 "+spread.toFixed(1)+"px rgba(255,236,170,"+(0.25*g).toFixed(2)+"))";
    // text beats
    hook.style.opacity    = seg(t,3.0,3.7,6.4,7.1);
    concept.style.opacity = seg(t,7.3,8.0,10.3,11.0);
    wisdom.style.opacity  = seg(t,12.0,12.7,15.3,16.0);
    // fade to darkness for a clean loop
    endfade.style.opacity = t<16.7 ? 0 : clamp((t-16.7)/1.3);
  }

  // register the seekable timeline; the first external seek hands control to the renderer
  var manual = false;
  function seek(t){ manual = true; render(t); }
  window.__timelines = window.__timelines || {};
  window.__timelines["kintsugi-short"] = { duration: DUR, seek: seek };

  // fit-to-viewport scaling (preview only; renderer uses the fixed 1080x1920 canvas)
  function fit(){
    var s = Math.min(window.innerWidth/1080, window.innerHeight/1920);
    root.style.transform = "scale("+s+")";
  }
  window.addEventListener("resize", fit); fit();

  // deterministic preview playback — stops the instant the renderer seeks
  var frame = 0, FPS = 60;
  (function loop(){
    if(!manual){ render((frame/FPS) % DUR); frame++; }
    requestAnimationFrame(loop);
  })();
  render(0);
})();
</script>
