{% extends "base.html" %}
{% block title %}Breakout{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-2">Breakout видео в нише</h1>
<p class="text-sm text-slate-600 mb-6">Что взлетело за последние N дней по запросу. Стоимость: 100 units (search.list).</p>

<form
    hx-post="/api/breakout/search"
    hx-target="#result"
    hx-indicator="#loading-indicator"
    hx-disabled-elt="find button"
    class="bg-white p-5 rounded-lg border border-slate-200 mb-6 flex flex-col gap-3"
>
    <input type="text" name="query" required placeholder="japanese ambient focus music"
           class="border border-slate-300 rounded px-4 py-2 focus:outline-none focus:border-red-400" />
    <div class="flex items-center gap-3">
        <label class="text-sm text-slate-600">Период:</label>
        <select name="days" class="border border-slate-300 rounded px-2 py-1">
            <option value="7">7 дней</option>
            <option value="14">14 дней</option>
            <option value="30" selected>30 дней</option>
            <option value="90">90 дней</option>
        </select>
        <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700 ml-auto">Искать</button>
    </div>
</form>

<div id="result"></div>
{% endblock %}
