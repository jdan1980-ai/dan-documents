{% extends "base.html" %}

{% block title %}Скоринг заголовка{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-2">Скоринг заголовка</h1>
<p class="text-sm text-slate-600 mb-6">Оценка длины, эмоций, чисел, маркеров кликбейта (0-100).</p>

<form
    hx-post="/api/title/score"
    hx-target="#result"
    hx-indicator="#loading-indicator"
    hx-disabled-elt="find button"
    class="bg-white p-5 rounded-lg border border-slate-200 mb-6 flex gap-3"
>
    <input
        type="text"
        name="title"
        placeholder="Я попробовал это и ШОКИРОВАН результатом"
        required
        class="flex-1 border border-slate-300 rounded px-4 py-2 focus:outline-none focus:border-red-400"
    />
    <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700">Оценить</button>
</form>

<div id="result"></div>
{% endblock %}
