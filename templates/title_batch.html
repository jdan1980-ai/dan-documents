{% extends "base.html" %}
{% block title %}Title A/B Batch{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-2">Title A/B Batch</h1>
<p class="text-sm text-slate-600 mb-6">Каждый вариант на новой строке. До 10 заголовков. Получишь таблицу со скорами рядом.</p>

<form
    hx-post="/api/title/batch"
    hx-target="#result"
    hx-indicator="#loading-indicator"
    hx-disabled-elt="find button"
    class="bg-white p-5 rounded-lg border border-slate-200 mb-6 flex flex-col gap-3"
>
    <textarea name="titles" rows="8" required placeholder="Best Focus Music Tokyo Rain Power Hour [1H Top Deep Work]&#10;Tokyo Rain Focus Music — 1H Power Hour [Deep Work]&#10;Need to Focus? Tokyo Rain Power Hour Music [1H]"
              class="border border-slate-300 rounded px-4 py-2 focus:outline-none focus:border-red-400"></textarea>
    <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700 self-end">Сравнить</button>
</form>

<div id="result"></div>
{% endblock %}
