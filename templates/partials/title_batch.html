<div class="bg-white p-5 rounded-lg border border-slate-200">
    <h3 class="font-semibold mb-3">Сравнение заголовков ({{ results | length }})</h3>
    <table class="w-full text-sm">
        <thead class="text-xs text-slate-500 uppercase border-b">
            <tr><th class="text-left py-2">#</th><th class="text-left">Заголовок</th><th class="text-right">Длина</th><th class="text-right">Score</th></tr>
        </thead>
        <tbody>
        {% for r in results %}
            <tr class="border-b last:border-0 hover:bg-slate-50">
                <td class="py-2 text-slate-400">{{ loop.index }}</td>
                <td class="py-2 font-mono text-xs">{{ r.title }}</td>
                <td class="text-right text-xs text-slate-500">{{ r.factors.length }}</td>
                <td class="text-right">
                    <span class="inline-block px-3 py-1 rounded font-semibold {% if r.score >= 80 %}bg-green-100 text-green-800{% elif r.score >= 60 %}bg-amber-100 text-amber-800{% else %}bg-red-100 text-red-800{% endif %}">{{ r.score }}</span>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% if results %}
    <div class="mt-4 text-sm bg-green-50 border border-green-200 rounded p-3">
        🏆 <strong>Победитель:</strong> <span class="font-mono text-xs">{{ results[0].title }}</span> — {{ results[0].score }}/100
    </div>
    {% endif %}
</div>
