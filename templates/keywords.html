{% extends "base.html" %}

{% block title %}Исследование ключевых слов{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-2">Ключевые слова</h1>
<p class="text-sm text-slate-600 mb-6">Поиск без квоты YouTube API через yt-dlp. Оценка конкуренции и связанные слова.</p>

<form
    hx-post="/api/keywords/research"
    hx-target="#result"
    hx-indicator="#loading-indicator"
    hx-disabled-elt="find button"
    class="bg-white p-5 rounded-lg border border-slate-200 mb-6 flex flex-col gap-3"
>
    <input
        type="text"
        name="query"
        placeholder="например: python для начинающих"
        required
        class="border border-slate-300 rounded px-4 py-2 focus:outline-none focus:border-red-400"
    />
    <div class="flex items-center gap-3">
        <label class="text-sm text-slate-600">Кол-во результатов:</label>
        <select name="limit" class="border border-slate-300 rounded px-2 py-1">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="40">40</option>
        </select>
        <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700 ml-auto">Поиск</button>
    </div>
</form>

<div id="result"></div>
{% endblock %}
