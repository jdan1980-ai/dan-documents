{% extends "base.html" %}
{% block title %}Тумбнейл{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-2">Анализ тумбнейла</h1>
<p class="text-sm text-slate-600 mb-6">Загрузи PNG/JPG — получишь оценку контраста, читаемости в ленте 320px и веса файла.</p>

<form
    hx-post="/api/thumbnail/analyze"
    hx-target="#result"
    hx-indicator="#loading-indicator"
    hx-disabled-elt="find button"
    hx-encoding="multipart/form-data"
    class="bg-white p-5 rounded-lg border border-slate-200 mb-6 flex flex-col gap-3"
>
    <input type="file" name="file" accept="image/png,image/jpeg" required
           class="border border-slate-300 rounded px-4 py-2 file:bg-red-600 file:text-white file:border-0 file:px-4 file:py-1 file:rounded file:cursor-pointer" />
    <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700 self-end">Проанализировать</button>
</form>

<div id="result"></div>
{% endblock %}
