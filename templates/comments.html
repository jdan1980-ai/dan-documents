{% extends "base.html" %}
{% block title %}Комменты{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-2">Анализ комментариев</h1>
<p class="text-sm text-slate-600 mb-6">Топ-100 комментов → частотные слова, sentiment, кол-во вопросов.</p>

<form
    hx-post="/api/comments/analyze"
    hx-target="#result"
    hx-indicator="#loading-indicator"
    hx-disabled-elt="find button"
    class="bg-white p-5 rounded-lg border border-slate-200 mb-6 flex flex-col gap-3"
>
    <input type="text" name="query" required placeholder="ID видео или ссылка"
           class="border border-slate-300 rounded px-4 py-2 focus:outline-none focus:border-red-400" />
    <div class="flex items-center gap-3">
        <label class="text-sm text-slate-600">Кол-во комментов:</label>
        <select name="max_comments" class="border border-slate-300 rounded px-2 py-1">
            <option>50</option><option selected>100</option><option>200</option>
        </select>
        <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700 ml-auto">Анализировать</button>
    </div>
</form>

<div id="result"></div>
{% endblock %}
