{% extends "base.html" %}
{% block title %}Competitor Score{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-2">🏆 Competitor Score</h1>
<p class="text-sm text-slate-600 mb-6">Сравнение твоего видео с топ-5 outliers в нише. Выдаёт gap-list: где конкуренты сильнее.</p>

<form
    hx-post="/api/competitor-score/analyze"
    hx-target="#result"
    hx-indicator="#loading-indicator"
    hx-disabled-elt="find button"
    class="bg-white p-5 rounded-lg border border-slate-200 mb-6 flex flex-col gap-3"
>
    <label class="text-sm font-semibold">Твоё видео (URL или ID)</label>
    <input type="text" name="video_url" required placeholder="https://youtube.com/watch?v=..."
           class="border border-slate-300 rounded px-4 py-2 focus:outline-none focus:border-red-400" />

    <label class="text-sm font-semibold mt-2">Запрос ниши</label>
    <input type="text" name="niche_query" required placeholder="japanese ambient focus music"
           class="border border-slate-300 rounded px-4 py-2 focus:outline-none focus:border-red-400" />
    <p class="text-xs text-slate-500">Стоимость: 100 units (search.list) при первом запросе по нише.</p>

    <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700 self-end mt-2">Сравнить</button>
</form>
<div id="result"></div>
{% endblock %}
