{% extends "base.html" %}
{% block title %}Video Velocity{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-2">⚡ Video Velocity</h1>
<p class="text-sm text-slate-600 mb-6">Скорость набора просмотров видео + сравнение с медианной скоростью канала.</p>

<form
    hx-post="/api/velocity/analyze"
    hx-target="#result"
    hx-indicator="#loading-indicator"
    hx-disabled-elt="find button"
    class="bg-white p-5 rounded-lg border border-slate-200 mb-6 flex flex-col gap-3"
>
    <input type="text" name="query" required placeholder="ID видео или ссылка"
           class="border border-slate-300 rounded px-4 py-2 focus:outline-none focus:border-red-400" />
    <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded hover:bg-red-700 self-end">Замерить</button>
</form>
<div id="result"></div>
{% endblock %}
